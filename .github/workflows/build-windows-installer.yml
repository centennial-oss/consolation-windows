name: Build Windows Installer

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
        description: Version string used in the .msixupload filename (e.g. 0.0.1 or 1.2.3)
      upload_artifact:
        required: false
        type: boolean
        default: false
        description: Upload the .msixupload as a workflow artifact for downstream jobs
    outputs:
      msix_upload_filename:
        description: Filename of the bundled .msixupload artifact
        value: ${{ jobs.build.outputs.msix_upload_filename }}

jobs:
  build:
    name: Build Windows Installer Artifact
    runs-on: windows-latest
    outputs:
      msix_upload_filename: ${{ steps.package.outputs.msix_upload_filename }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set release version
        shell: bash
        run: echo "RELEASE_VERSION=${{ inputs.release_version }}" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Build the release MSIX packages unsigned
      - name: Build release MSIX packages
        shell: bash
        run: make build-release

      # Bundle x86/x64/arm64 .msix packages into a Store-ready .msixupload (MakeAppx + zip)
      - name: Bundle packages into .msixupload
        id: package
        shell: pwsh
        run: ./scripts/New-MsixUpload.ps1 -ReleaseVersion $env:RELEASE_VERSION -WorkspaceRoot $env:GITHUB_WORKSPACE

      - name: Upload .msixupload artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: msixupload
          path: ${{ steps.package.outputs.msix_upload }}
          if-no-files-found: error
