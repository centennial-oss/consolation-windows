name: Build + Submit Windows Release

on:
  push:
    tags:
      # Semantic version tags: v1.0.0, v2.1.3, etc.
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve release version from tag
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Strip v prefix from tag
        id: version
        shell: bash
        run: echo "release_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

  build-windows-installer:
    name: Build Windows Installer Artifact
    needs: resolve-version
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      release_version: ${{ needs.resolve-version.outputs.release_version }}

  submit-to-store:
    needs: build-windows-installer
    uses: ./.github/workflows/submit-to-store.yml
    with:
      msix_upload_filename: ${{ needs.build-windows-installer.outputs.msix_upload_filename }}
    secrets: inherit

  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [build-windows-installer, submit-to-store]

    steps:
      # Note: no `files:` are attached / no local code signing
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Consolation ${{ github.ref_name }}
          draft: true
          prerelease: false
