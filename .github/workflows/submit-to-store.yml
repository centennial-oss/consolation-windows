name: Submit to Microsoft Store

on:
  workflow_call:

jobs:
  submit:
    name: Upload draft submission to Partner Center
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download .msixupload artifact
        uses: actions/download-artifact@v8
        with:
          name: msixupload
          path: msix-packages

      - name: Verify Store packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packagesDir = Join-Path $env:GITHUB_WORKSPACE 'msix-packages'
          $uploads = Get-ChildItem -Path $packagesDir -Recurse -File |
            Where-Object { $_.Extension -eq '.msixupload' }
          if (-not $uploads) {
            Write-Host 'Contents of msix-packages:'
            Get-ChildItem -Path $packagesDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "No .msixupload files found in $packagesDir"
          }
          $invalid = $uploads | Where-Object { $_.Directory.Parent.FullName -ne $packagesDir }
          if ($invalid) {
            Write-Host 'Contents of msix-packages:'
            Get-ChildItem -Path $packagesDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Each .msixupload must be exactly one directory below $packagesDir for msstore's WinUI publisher."
          }
          Write-Host "Store packages to publish ($($uploads.Count)):"
          $uploads | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
          "MSIX_PACKAGES_DIR=$packagesDir" >> $env:GITHUB_ENV
          "CONSOLATION_PROJECT_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'Consolation')" >> $env:GITHUB_ENV

      # Configure MS Partner Center credentials
      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Configure Microsoft Store Developer CLI
        shell: bash
        env:
          MSSTORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          # Strip any stray whitespace/newlines that may have been pasted into the
          # secrets (a trailing newline alone breaks the seller-id integer parse).
          MSSTORE_SELLER_ID="$(printf '%s' "$MSSTORE_SELLER_ID" | tr -d '[:space:]')"
          MSSTORE_TENANT_ID="$(printf '%s' "$MSSTORE_TENANT_ID" | tr -d '[:space:]')"
          MSSTORE_CLIENT_ID="$(printf '%s' "$MSSTORE_CLIENT_ID" | tr -d '[:space:]')"

          # The CLI parses the seller id as an integer. Fail early with a clear message
          # (never echoing the value) if it is not purely numeric, e.g. if the Publisher
          # ID (a GUID) was stored in the SELLER_ID secret by mistake.
          if ! [[ "$MSSTORE_SELLER_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::SELLER_ID secret must be the numeric Partner Center Seller ID (digits only), not the Publisher ID GUID or any other value." >&2
            exit 1
          fi

          msstore reconfigure \
            --tenantId "$MSSTORE_TENANT_ID" \
            --sellerId "$MSSTORE_SELLER_ID" \
            --clientId "$MSSTORE_CLIENT_ID" \
            --clientSecret "$MSSTORE_CLIENT_SECRET"

      # pathOrUrl must be the WinUI project; -i points at the built .msixupload files.
      # Passing only the packages dir as pathOrUrl fails with "no project publisher".
      # WinUI publishing only includes files exactly one directory below the -i directory.
      - name: Upload draft submission to Partner Center
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Project: $env:CONSOLATION_PROJECT_DIR"
          Write-Host "Packages: $env:MSIX_PACKAGES_DIR"
          msstore publish "$env:CONSOLATION_PROJECT_DIR" `
            -i "$env:MSIX_PACKAGES_DIR" `
            -id "$env:STORE_PRODUCT_ID" `
            --noCommit `
            --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
